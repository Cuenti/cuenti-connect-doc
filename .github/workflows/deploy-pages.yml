name: Deploy developer portal to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_ASSET_PREFIX: /cuenti-connect-doc/
      PUBLIC_PROXY_BASE_URL: https://cuenti-connect.cuenti.co
      PUBLIC_TRY_IT_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure private registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          config_file="$RUNNER_TEMP/cuenti-npmrc"
          test -n "$NPM_TOKEN"
          printf '%s\n' '@cuenti-dna:registry=https://package-manager.cuenti.co/' > "$config_file"
          case "$NPM_TOKEN" in
            *:_authToken=*) printf '%s\n' "$NPM_TOKEN" >> "$config_file" ;;
            *) printf '//package-manager.cuenti.co/:_authToken=%s\n' "$NPM_TOKEN" >> "$config_file" ;;
          esac
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$config_file" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm run verify

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
